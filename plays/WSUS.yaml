
---
- name: Check clamav-freshclam status and extract database info
  hosts: all
  become: yes
  tasks:
    - name: Check the status of clamav-freshclam service
      shell: systemctl status clamav-freshclam | grep -i 'database'
      register: freshclam_status
      ignore_errors: yes

    - name: Get the server's IP address
      command: hostname -I
      register: server_ip
      changed_when: false

    - name: Save status and database info to /tmp
      copy:
        content: |
          Server IP: {{ server_ip.stdout.strip() }}
          -------------------------------------
          {{ freshclam_status.stdout }}
        dest: "/tmp/clamav_status_{{ server_ip.stdout.split()[0] }}.log"


























